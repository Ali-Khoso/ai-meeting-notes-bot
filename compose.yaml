services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: "1gb"
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - meeting-data:/app/data
      - whisper-cache:/home/pwuser/.cache
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - ollama-models:/root/.ollama
volumes:
  meeting-data:
  whisper-cache:
  ollama-models:
